title: LSASS Access via Malicious GrantedAccess Mask
id: 4a8e2b1c-3d5f-4e7a-9b2c-1c4d7e9f3b6c
status: test
description: Detects process access events to LSASS with high-confidence credential-dumping access masks.
references:
    - https://attack.mitre.org/techniques/T1003/001/
    - https://docs.microsoft.com/en-us/sysinternals/downloads/procdump
author: ges-cs01
date: 2026/05/18
tags:
    - attack.credential_access
    - attack.t1003.001
logsource:
    product: windows
    category: process_access
detection:
    selection_procaccess:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess|contains:
            - '0x1010'
            - '0x1fffff'
            - '0x143a'
            - '0x1438'
            - '0x1418'
    filter_defender:
        SourceImage|endswith: 
            - '\MsMpEng.exe'
            - '\WdFilter.sys'
    condition: selection_procaccess and not filter_defender
falsepositives:
    - Other EDR or third-party Antivirus solutions monitoring LSASS memory (must be whitelisted by SourceImage locally)
level: critical
fields:
    - SourceImage
    - TargetImage
    - GrantedAccess
    - User
